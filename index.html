<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retos Deportivos - Autenticación, Strava & Mercado Pago</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --strava-color: #fc4c02;
            --mp-color: #009ee3;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2, h3 { margin-top: 0; }
        
        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover { background-color: var(--accent-hover); }

        .btn-strava { background-color: var(--strava-color); }
        .btn-strava:hover { background-color: #d33c00; }

        .btn-mp { background-color: var(--mp-color); }
        .btn-mp:hover { background-color: #0081bc; }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: white;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .hidden { display: none; }

        .user-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.5);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stat-box strong {
            font-size: 1.1rem;
            color: var(--text-color);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- SECCIÓN 1: LOGIN / REGISTRO -->
    <div id="authSection" class="card">
        <h2>🔐 Ingresar a la App</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Registrate para unirte a los pozos y competir.</p>
        
        <input type="email" id="loginEmail" placeholder="Correo electrónico">
        <input type="password" id="loginPass" placeholder="Contraseña">
        
        <button onclick="simularLogin()">Iniciar Sesión / Registrarse</button>
    </div>

    <!-- SECCIÓN 2: DASHBOARD DEL USUARIO -->
    <div id="dashboardSection" class="card hidden">
        <div class="user-badge">
            <span id="welcomeUser">Hola, Usuario</span>
            <button onclick="cerrarSesion()" style="width: auto; padding: 4px 8px; font-size: 0.8rem; margin:0; background: #ef4444;">Salir</button>
        </div>

        <h3>🏃‍♂️ Reto: 10 KM en el día</h3>
        
        <div class="stat-grid">
            <div class="stat-box">
                <span>Buy-in (Entrada)</span>
                <strong>$2.000 ARS</strong>
            </div>
            <div class="stat-box">
                <span>Inscritos Pagos</span>
                <strong id="inscritosCount">3</strong>
            </div>
        </div>

        <!-- FLUJO 1: PAGO CON MERCADO PAGO -->
        <div id="paymentSection">
            <p style="color: var::text-muted; font-size: 0.85rem;">Para participar, realizá el pago del Buy-in.</p>
            <button class="btn-mp" onclick="pagarBuyIn()">Pagar Buy-in con Mercado Pago 💙</button>
        </div>

        <div id="paymentSuccessSection" class="hidden">
            <p style="color: #34d399; font-size: 0.9rem; font-weight: bold; margin-bottom: 8px;">✔ Buy-in abonado con éxito</p>
            
            <!-- FLUJO 2: CONEXIÓN STRAVA -->
            <div id="stravaNotConnected">
                <button class="btn-strava" onclick="conectarStrava()">Conectar con Strava 🧡</button>
            </div>

            <div id="stravaConnected" class="hidden">
                <p style="color: #34d399; font-size: 0.85rem; font-weight: bold; margin: 8px 0;">✔ Strava vinculado</p>
                <button onclick="verificarProgresoStrava()" style="background-color: #3b82f6;">Verificar mi Actividad de Hoy</button>
            </div>
        </div>

        <div id="resultadoValidacion" style="margin-top: 12px; font-size: 0.85rem; font-family: monospace;"></div>
    </div>

</div>

<script>
    let usuarioActual = null;
    let inscritos = 3;

    function simularLogin() {
        const email = document.getElementById('loginEmail').value;
        if (!email) {
            alert('Por favor ingresá un correo.');
            return;
        }

        usuarioActual = { email: email, paid: false, stravaLinked: false };
        
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('welcomeUser').innerText = `Hola, ${email.split('@')[0]}`;
    }

    function cerrarSesion() {
        usuarioActual = null;
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('paymentSuccessSection').classList.add('hidden');
        document.getElementById('paymentSection').classList.remove('hidden');
        document.getElementById('stravaConnected').classList.add('hidden');
        document.getElementById('stravaNotConnected').classList.remove('hidden');
        document.getElementById('resultadoValidacion').innerText = '';
    }

    function pagarBuyIn() {
        alert("Redirigiendo al checkout seguro de Mercado Pago...");
        setTimeout(() => {
            usuarioActual.paid = true;
            inscritos++;
            document.getElementById('inscritosCount').innerText = inscritos;
            document.getElementById('paymentSection').classList.add('hidden');
            document.getElementById('paymentSuccessSection').classList.remove('hidden');
            alert("¡Pago aprobado! Ya podés vincular tu cuenta deportiva.");
        }, 1200);
    }

    function conectarStrava() {
        alert("Redirigiendo a Strava para autorizar permisos...");
        setTimeout(() => {
            usuarioActual.stravaLinked = true;
            document.getElementById('stravaNotConnected').classList.add('hidden');
            document.getElementById('stravaConnected').classList.remove('hidden');
            alert("¡Strava conectado correctamente!");
        }, 1000);
    }

    function verificarProgresoStrava() {
        const cajaRes = document.getElementById('resultadoValidacion');
        cajaRes.style.color = "#f59e0b";
        cajaRes.innerText = "Consultando API oficial de Strava...";

        setTimeout(() => {
            const distanciaSimulada = 10.4; 
            if (distanciaSimulada >= 10) {
                cajaRes.style.color = "#34d399";
                cajaRes.innerText = `✅ ¡Reto cumplido! Actividad registrada: ${distanciaSimulada} km. Quedás habilitado para el pozo.`;
            } else {
                cajaRes.style.color = "#ef4444";
                cajaRes.innerText = `❌ Actividad insuficiente: ${distanciaSimulada} km (Necesitás llegar a 10 km).`;
            }
        }, 1500);
    }
</script>

</body>
</html>
