<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lavo Todo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; background: #f5f5f7; color: #111; }
  header { background: #111; color: #fff; padding: 22px 16px; }
  main { max-width: 760px; margin: auto; padding: 12px 14px 40px; }
  h1 { margin: 0; font-size: 24px; }
  .muted { color: #777; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .card { background: #fff; border-radius: 18px; padding: 16px; margin: 10px 0; box-shadow: 0 2px 10px #0001; }
  .big { font-size: 25px; font-weight: 800; }
  .btn { border: 0; border-radius: 13px; padding: 14px; background: #111; color: #fff; font-weight: 700; width: 100%; margin-top: 8px; font-size: 15px; }
  .alt { background: #e9e9ee; color: #111; }
  .green { background: #16834b; }
  .red { background: #c93434; }
  .del-btn { background: #ff3b30; color: #fff; border: 0; border-radius: 8px; padding: 4px 8px; font-size: 12px; margin-left: 8px; cursor: pointer; }
  input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; margin: 6px 0 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
  .hidden { display: none; }
  .ok { color: #16834b; }
  .bad { color: #c93434; }
</style>
</head>
<body>
<header>
  <h1>🚗 Lavo Todo</h1>
  <div style="opacity:.7">Caja · ahorro · reinversión · disponible</div>
</header>
<main>
  <div class="grid">
    <div class="card">
      <div class="muted">💵 Efectivo</div>
      <div id="cash" class="big">$0</div>
    </div>
    <div class="card">
      <div class="muted">📱 Mercado Pago</div>
      <div id="mp" class="big">$0</div>
    </div>
  </div>
  <div class="card">
    <div class="muted">💰 Total</div>
    <div id="total" class="big">$0</div>
    <div id="reserve" class="muted"></div>
  </div>
  <div class="card">
    <h3>🚗 Cargar lavado</h3>
    <div class="grid">
      <button class="btn" onclick="wash(25000)">$25.000</button>
      <button class="btn" onclick="wash(30000)">$30.000</button>
      <button class="btn" onclick="wash(35000)">$35.000</button>
      <button class="btn" onclick="wash(40000)">$40.000</button>
    </div>
    <div id="wf" class="hidden">
      <input id="qty" type="number" min="1" value="1">
      <select id="wm">
        <option value="cash">💵 Efectivo</option>
        <option value="mp">📱 Mercado Pago</option>
      </select>
      <button class="btn green" onclick="saveWash()">Confirmar</button>
    </div>
  </div>
  <div class="card">
    <h3>➕ Otro ingreso</h3>
    <input id="id" placeholder="Descripción">
    <input id="ia" type="number" placeholder="Monto">
    <select id="im">
      <option value="cash">💵 Efectivo</option>
      <option value="mp">📱 Mercado Pago</option>
    </select>
    <button class="btn" onclick="income()">Guardar ingreso</button>
  </div>
  <div class="card">
    <h3>💸 Cargar gasto</h3>
    <select id="ec">
      <option>🧴 Productos</option>
      <option>⛽ Combustible</option>
      <option>🔧 Mantenimiento</option>
      <option>🛒 Herramientas</option>
      <option>💳 Tarjeta</option>
      <option>📦 Otro</option>
    </select>
    <input id="ed" placeholder="Detalle">
    <input id="ea" type="number" placeholder="Monto">
    <select id="em">
      <option value="cash">💵 Efectivo</option>
      <option value="mp">📱 Mercado Pago</option>
    </select>
    <button class="btn red" onclick="expense()">Guardar gasto</button>
  </div>
  <div class="card">
    <h3>📊 Resumen</h3>
    <div class="grid">
      <button class="btn alt" onclick="summary('d')">Hoy</button>
      <button class="btn alt" onclick="summary('w')">Semana</button>
      <button class="btn alt" onclick="summary('m')">Mes</button>
    </div>
    <div id="sum" style="margin-top: 10px;"></div>
  </div>
  <div class="card">
    <h3>🎯 Objetivos</h3>
    <label>Dólar de referencia</label>
    <input id="usd" type="number" value="1500" onchange="settings()">
    <label>USD ahorrados</label>
    <input id="saved" type="number" value="0" onchange="settings()">
    <div id="goal" style="margin-top:10px;"></div>
    <div class="row"><span>🏖️ Meta vacaciones</span><b>USD 1.200</b></div>
    <div class="row"><span>💳 Tarjeta cada día 8</span><b>$600.000</b></div>
    <div class="row"><span>📈 Reinversión sugerida</span><b>10%</b></div>
  </div>
  <div class="card">
    <h3>📜 Historial y Últimos Movimientos</h3>
    <div id="hist"></div>
  </div>
  <div class="card">
    <button class="btn alt" onclick="backup()">Exportar respaldo</button>
    <button class="btn alt" onclick="wipe()">Borrar datos</button>
  </div>
</main>
<script>
const K='lavadero_finanzas_v3';
let D=JSON.parse(localStorage.getItem(K)||'null')||{moves:[],usd:1500,saved:0};
let P=0;
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);

function save(){
  localStorage.setItem(K,JSON.stringify(D));
  render();
  summary(currentSummaryType);
}

function wash(p){P=p;$('wf').classList.remove('hidden');$('qty').focus()}
function add(type,amount,method,cat,desc){
  D.moves.push({id: Date.now(), date:new Date().toISOString(), type, amount, method, cat, desc});
  save();
}
function saveWash(){
  let q=Math.max(1,+$('qty').value||1);
  add('in',P*q,$('wm').value,'Lavado',q+' × '+fmt(P));
  P=0; $('wf').classList.add('hidden'); $('qty').value='1';
}
function income(){
  let a=+$('ia').value;
  if(a){
    add('in',a,$('im').value,'Otro',$('id').value||'Otro ingreso');
    $('ia').value=''; $('id').value='';
  }
}
function expense(){
  let a=+$('ea').value;
  if(a){
    add('out',a,$('em').value,$('ec').value,$('ed').value||$('ec').value);
    $('ea').value=''; $('ed').value='';
  }
}

function removeMove(id){
  if(confirm('¿Eliminar este movimiento?')){
    D.moves = D.moves.filter(x => x.id !== id);
    save();
  }
}

let currentSummaryType = 'd';
function calc(kind){
  let now=new Date(),s=new Date(now);
  if(kind==='d')s.setHours(0,0,0,0);
  if(kind==='w'){let d=(now.getDay()+6)%7;s.setDate(now.getDate()-d);s.setHours(0,0,0,0)}
  if(kind==='m')s=new Date(now.getFullYear(),now.getMonth(),1);
  let a=D.moves.filter(x=>new Date(x.date)>=s);
  let i=a.filter(x=>x.type==='in').reduce((z,x)=>z+x.amount,0);
  let o=a.filter(x=>x.type==='out').reduce((z,x)=>z+x.amount,0);
  return [a,i,o,i-o];
}

function summary(k){
  currentSummaryType = k;
  let [a,i,o,n]=calc(k);
  let title = k==='d'?'Hoy':k==='w'?'Esta semana':'Este mes';
  $('sum').innerHTML='<div class="muted" style="margin-bottom:6px;font-weight:bold;">Mostrando: '+title+'</div>'+
    '<div class="row"><span>Ingresos</span><b>'+fmt(i)+'</b></div>'+
    '<div class="row"><span>Gastos</span><b>'+fmt(o)+'</b></div>'+
    '<div class="row"><span>Neto</span><b class="'+(n>=0?'ok':'bad')+'">'+fmt(n)+'</b></div>'+
    '<div class="row"><span>Movimientos</span><b>'+a.length+'</b></div>';
}

function settings(){
  D.usd=+$('usd').value||1500;
  D.saved=+$('saved').value||0;
  save();
}

function render(){
  let c=0,m=0;
  D.moves.forEach(x=>{
    let v=x.type==='in'?x.amount:-x.amount;
    if(x.method==='cash')c+=v; else m+=v;
  });
  $('cash').textContent=fmt(c);
  $('mp').textContent=fmt(m);
  $('total').textContent=fmt(c+m);

  let now=new Date(),n=new Date(now.getFullYear(),now.getMonth(),8);
  if(now>=n)n.setMonth(n.getMonth()+1);
  let days=Math.max(1,Math.ceil((n-now)/86400000));
  $('reserve').innerHTML='💳 Faltan '+fmt(Math.max(0,600000-(c+m)))+' para la tarjeta · '+days+' días';

  let left=Math.max(0,1200-D.saved);
  $('goal').innerHTML='🏖️ Falta ahorrar <b>USD '+left.toLocaleString('es-AR')+'</b> · equivalente a '+fmt(left*D.usd);
  $('usd').value=D.usd;
  $('saved').value=D.saved;

  $('hist').innerHTML=D.moves.slice(-10).reverse().map(x=>
    '<div class="row"><span>'+new Date(x.date).toLocaleDateString('es-AR')+' · '+x.desc+' ('+(x.method==='cash'?'Efectivo':'MP')+')</span>'+
    '<div><b class="'+(x.type==='in'?'ok':'bad')+'">'+(x.type==='in'?'+':'-')+fmt(x.amount)+'</b>'+
    '<button class="del-btn" onclick="removeMove('+x.id+')">✕</button></div></div>'
  ).join('')||'<div class="muted">Todavía no hay movimientos.</div>';
}

render();
summary('d');
</script>
</body>
</html>
